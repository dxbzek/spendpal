<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17663a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Open the connection to the database while the app's code downloads. -->
    <link rel="preconnect" href="https://uwvlhdkxhvcxccutaoew.supabase.co" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- One head per public page: the build writes privacy.html, terms.html,
         auth.html and 404.html from this file with their own title,
         description and canonical (src/lib/publicSite.ts). -->
    <title>SpendPal | Personal finance tracker</title>
    <meta name="description" content="Track your accounts, cards, budgets, instalment plans and savings goals in one place. You type in or import your own records. There is no bank connection." />
    <link rel="canonical" href="https://spendpal.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spendpal.vercel.app/" />
    <meta property="og:site_name" content="SpendPal" />
    <meta property="og:title" content="SpendPal | Personal finance tracker" />
    <meta property="og:description" content="Track your accounts, cards, budgets, instalment plans and savings goals in one place. You type in or import your own records. There is no bank connection." />
    <meta property="og:image" content="https://spendpal.vercel.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpendPal | Personal finance tracker" />
    <meta name="twitter:description" content="Track your accounts, cards, budgets, instalment plans and savings goals in one place. You type in or import your own records. There is no bank connection." />
    <meta name="twitter:image" content="https://spendpal.vercel.app/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SpendPal",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "url": "https://spendpal.vercel.app/",
      "description": "Track your accounts, cards, budgets, instalment plans and savings goals in one place. You type in or import your own records. There is no bank connection."
    }
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-shell-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;font-family:sans-serif;gap:12px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#17663a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
        <span style="color:#17663a;font-size:14px">Loading…</span>
      </div>
    </div>
    <noscript>
      <p>SpendPal is a personal finance tracker for your accounts, cards, budgets, instalment plans and savings goals. It needs JavaScript to run.</p>
      <p><a href="/privacy">Privacy policy</a> | <a href="/terms">Terms of use</a></p>
    </noscript>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('app-shell-loader');
        if (!el) return;
        // Build with DOM APIs + textContent so the (untrusted) error message
        // can never inject markup into the shell.
        el.textContent = '';
        var box = document.createElement('div');
        box.style.cssText = 'max-width:400px;text-align:center;padding:24px';
        var icon = document.createElement('p');
        icon.style.fontSize = '2rem';
        icon.textContent = '⚠️';
        var title = document.createElement('p');
        title.style.cssText = 'font-weight:600;margin:8px 0';
        title.textContent = 'Something went wrong';
        var msg = document.createElement('p');
        msg.style.cssText = 'color:#666;font-size:13px;word-break:break-all';
        msg.textContent = (e && e.message) ? String(e.message) : '';
        var btn = document.createElement('button');
        btn.style.cssText = 'margin-top:16px;padding:8px 20px;background:#17663a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px';
        btn.textContent = 'Reload';
        btn.addEventListener('click', function() { location.reload(); });
        box.appendChild(icon);
        box.appendChild(title);
        box.appendChild(msg);
        box.appendChild(btn);
        el.appendChild(box);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
